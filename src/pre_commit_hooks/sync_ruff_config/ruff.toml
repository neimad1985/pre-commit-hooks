line-length = 120

[lint]
select = ["ALL"]
# Règles en conflit avec le formateur ruff, d'après sa documentation.
ignore = [
    "W191",
    "E111",
    "E114",
    "E117",
    "D203",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",
    "COM812",
    "COM819",
    # Les docstrings ne sont obligatoires nulle part.
    "D1",
    # Le résumé d'une docstring commence à la ligne qui suit les guillemets (D213).
    "D212",
    # La licence du dépôt suffit, sans mention de copyright par fichier.
    "CPY001",
    # Python 3.14 n'évalue plus les annotations au chargement : les blocs TYPE_CHECKING n'apportent rien.
    "TC001",
    "TC002",
    "TC003",
    # Les hooks lancent des commandes écrites en dur, comme git, sans chemin absolu commun aux machines.
    "S603",
    "S607",
    # Les exceptions standard portent leur message : pas de classe dédiée sans attribut.
    "TRY003",
]

[lint.per-file-ignores]
# python -O supprime les assert, ce qui ne concerne pas les tests.
"tests/**" = ["S101"]
