repos:
  - repo: https://github.com/neimad1985/pre-commit-hooks
    rev: {rev}
    hooks:
      - id: sync-pre-commit-config
      - id: check-gitignore
      - id: check-transcrypt
      - id: sync-ruff-config
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
