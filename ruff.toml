line-length = 120

[lint]
select = ["ALL"]
# Rules that conflict with the ruff formatter, according to its documentation.
ignore = [
    "W191",
    "E111",
    "E114",
    "E117",
    "D203",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",
    "COM812",
    "COM819",
    # Docstrings are not required anywhere.
    "D1",
    # A docstring summary starts on the line after the opening quotes (D213).
    "D212",
    # No copyright notice per file.
    "CPY001",
    # Python 3.14 no longer evaluates annotations at import time: TYPE_CHECKING blocks add nothing.
    "TC001",
    "TC002",
    "TC003",
    # Hooks run hard-coded commands, such as git, with no absolute path shared across machines.
    "S603",
    "S607",
    # Standard exceptions carry their message: no dedicated class without attributes.
    "TRY003",
]

[lint.per-file-ignores]
# python -O strips assert statements, which does not affect tests.
"tests/**" = ["S101"]
