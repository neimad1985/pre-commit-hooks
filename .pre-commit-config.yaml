repos:
- repo: local
  hooks:
  - id: sync-pre-commit-config
    name: sync pre-commit config
    description: Rewrites .pre-commit-config.yaml from the latest reference and fails
      if it changed.
    entry: uv run sync-pre-commit-config
    language: system
    always_run: true
    pass_filenames: false
  - id: check-gitignore
    name: check gitignore
    description: Adds the required lines missing from .gitignore and fails if any
      was missing.
    entry: uv run check-gitignore
    language: system
    always_run: true
    pass_filenames: false
  - id: check-transcrypt
    name: check transcrypt
    description: Adds the transcrypt line missing from .gitattributes and initializes
      transcrypt if needed.
    entry: uv run check-transcrypt
    language: system
    always_run: true
    pass_filenames: false
  - id: sync-ruff-config
    name: sync ruff config
    description: Rewrites ruff.toml from the reference in a repository with Python
      files and fails if it changed.
    entry: uv run sync-ruff-config
    language: system
    always_run: true
    pass_filenames: false
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.1
  hooks:
  - id: ruff-check
    args:
    - --fix
  - id: ruff-format
