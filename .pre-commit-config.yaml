repos:
- repo: local
  hooks:
  - id: sync-pre-commit-config
    name: sync pre-commit config
    description: Rewrites .pre-commit-config.yaml from the latest reference and fails
      if it changed.
    entry: uv run sync-pre-commit-config
    language: system
    always_run: true
    pass_filenames: false
  - id: check-gitignore
    name: check gitignore
    description: Adds the required lines missing from .gitignore and fails if any
      was missing.
    entry: uv run check-gitignore
    language: system
    always_run: true
    pass_filenames: false
  - id: check-transcrypt
    name: check transcrypt
    description: Adds the transcrypt line missing from .gitattributes and initializes
      transcrypt if needed.
    entry: uv run check-transcrypt
    language: system
    always_run: true
    pass_filenames: false
