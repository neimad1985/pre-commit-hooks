- id: sync-pre-commit-config
  name: sync pre-commit config
  description: Rewrites .pre-commit-config.yaml from the latest reference and fails if it changed.
  entry: sync-pre-commit-config
  language: python
  always_run: true
  pass_filenames: false
- id: check-gitignore
  name: check gitignore
  description: Adds the required lines missing from .gitignore and fails if any was missing.
  entry: check-gitignore
  language: python
  always_run: true
  pass_filenames: false
- id: check-transcrypt
  name: check transcrypt
  description: Adds the transcrypt line missing from .gitattributes and initializes transcrypt if needed.
  entry: check-transcrypt
  language: python
  always_run: true
  pass_filenames: false
- id: sync-ruff-config
  name: sync ruff config
  description: Rewrites ruff.toml from the reference in a repository with Python files and fails if it changed.
  entry: sync-ruff-config
  language: python
  always_run: true
  pass_filenames: false
