[project]
name = "pre-commit-hooks"
version = "0.1.0"
description = "Shared pre-commit hooks that keep every project on the same configuration."
readme = "README.md"
authors = [
    { name = "Damien Montigny", email = "damien.montigny@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pyyaml==6.0.3",
    "typer==0.27.3",
]

[project.scripts]
sync-pre-commit-config = "pre_commit_hooks.sync_pre_commit_config.cli:app"
check-gitignore = "pre_commit_hooks.check_gitignore.cli:app"
check-transcrypt = "pre_commit_hooks.check_transcrypt.cli:app"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
